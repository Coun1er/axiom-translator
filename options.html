<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Axiom · Перевод и AI</title><link rel="stylesheet" href="options.css"></head>
<body><main><p class="eyebrow">AXIOM TRANSLATOR · 1.1.5</p><h1>Перевод и AI-нарратив</h1><p>Перевод работает через Google. AI-разбор — через OpenRouter и только после нажатия AI в Twitter-окне.</p>
<form id="settings"><label for="key">Ключ OpenRouter</label><input type="password" id="key" autocomplete="off" placeholder="Вставь ключ здесь"><small id="key-state">Проверка настроек…</small>
<label for="model">Модель</label><input id="model" spellcheck="false" required><small>По умолчанию — модель из твоего примера. Если ID недоступен у OpenRouter, можно указать другой вручную.</small>
<div class="actions"><button type="submit">Сохранить</button><button type="button" id="remove">Удалить ключ</button></div><p id="status" role="status"></p></form>
</main><script src="options.js"></script></body></html>
